<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaw & Team Wedding</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#FAF5EC; /* Cream/Off-white */
    color:rgb(74, 70, 62); /* Dark contrast version of your Taupe for readable text */
    font-family:'Noto Sans Thai',sans-serif;
}

:root {
    --crimson: rgb(157, 31, 36); /* #9D1F24 - Main Accent */
    --taupe: rgb(174, 163, 144); /* #AEA390 - Your specific Taupe */
    --cream-bg: #FAF5EC; /* Light Cream */
    --card-white: #FCFBF9; /* White Cream for cards */
}

/* ── Original Styles ── */
section{
    max-width:1000px;
    margin:auto;
    padding:80px 25px;
}

.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.countdown{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:30px;
}

.box{
    width:130px;
    padding:25px;
    background:var(--card-white);
    border-radius:18px;
    box-shadow:0 8px 25px rgba(157,31,36,0.04);
    border:1px solid rgba(174,163,144,0.3);
}

.number{
    font-size:3rem;
    color:var(--crimson);
    font-weight:700;
}

.label{
    color:var(--taupe);
    font-weight:500;
}

h1{
    font-size:5rem;
    color:var(--crimson);
    letter-spacing:4px;
    font-weight:700;
}

.subtitle{
    margin-top:15px;
    color:var(--taupe);
    letter-spacing:2px;
    font-weight:600;
}

.date{
    margin-top:30px;
    border:1px solid var(--crimson);
    padding:12px 35px;
    color:var(--crimson);
    font-weight:600;
    border-radius:30px;
    background:rgba(157,31,36,0.03);
}

h2{
    font-size:3rem;
    color:var(--crimson);
    text-align:center;
    margin-bottom:40px;
    font-weight:700;
}

.card{
    background:var(--card-white);
    border-radius:20px;
    padding:40px;
    box-shadow:0 8px 25px rgba(174,163,144,0.15);
    border:1px solid rgba(174,163,144,0.25);
}

.card p{
    margin-bottom:15px;
}

iframe{
    width:100%;
    height:420px;
    border:0;
    border-radius:20px;
}

footer{
    text-align:center;
    padding:50px 20px;
    color:var(--taupe);
    background:#EDE7DE; /* Slightly darker cream/taupe blend for footer */
    border-top:1px solid rgba(139,128,122,0.1);
}

@media(max-width:768px){

    h1{
        font-size:3rem;
    }

    h2{
        font-size:2.2rem;
    }

    .hero{
        min-height:auto;
        padding-top:40px;
        padding-bottom:40px;
    }

    .countdown{
        gap:8px;
        width:100%;
        max-width:360px;
        margin-left:auto;
        margin-right:auto;
    }

    .box{
        flex: 1;
        min-width: 0;
        padding: 10px 5px;
        border-radius: 12px;
    }

    .number{
        font-size:1.6rem;
    }

    .label{
        font-size:0.75rem;
    }

}
</style>
</head>

<body>

<!-- Original Content -->
<section class="hero">

    <div class="countdown">
        <div class="box">
            <div id="days" class="number">0</div>
            <div class="label">วัน</div>
        </div>

        <div class="box">
            <div id="hours" class="number">0</div>
            <div class="label">ชั่วโมง</div>
        </div>

        <div class="box">
            <div id="minutes" class="number">0</div>
            <div class="label">นาที</div>
        </div>

        <div class="box">
            <div id="seconds" class="number">0</div>
            <div class="label">วินาที</div>
        </div>
    </div>

    <img src="pics/logo.png" alt="Gaw & Team Logo" style="width:100%; height:auto; display:block;">

    <div class="subtitle">
        WEDDING CELEBRATION
    </div>

    <div class="date">
        12 กันยายน 2569
    </div>

</section>

<section>
    <h2>Our Story</h2>

    <div class="card" style="text-align:center;">
        ขอเชิญร่วมเป็นสักขีพยานในวันสำคัญของเรา
        และร่วมแบ่งปันช่วงเวลาแห่งความสุข
        ในพิธีมงคลสมรสของ
        <strong>Gaw และ Team</strong>
    </div>
</section>

    <h2>Schedule</h2>

    <div class="card">
        <p><strong>17:30 น.</strong> ลงทะเบียน</p>
        <p><strong>18:30 น.</strong> พิธีมงคลสมรส</p>
        <p><strong>19:00 น.</strong> รับประทานอาหาร</p>
        <p><strong>21:30 น.</strong> จบงาน</p>
    </div>
</section>
-->

<section>
    <h2>Venue</h2>

    <div class="card">

        <h3 style="color:var(--crimson); margin-bottom:15px;">
            Eastin Grand Hotel Sathorn
        </h3>

        <p style="margin-bottom:25px;">
            โรงแรมอีสติน แกรนด์ สาทร กรุงเทพมหานคร
        </p>

        <video autoplay muted loop playsinline style="width:100%; height:auto; border-radius:20px; margin-bottom:25px; display:block;">
            <source src="vdo/hotel_iphone.mp4" type="video/mp4">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
        </video>

        <iframe
            src="https://www.google.com/maps?q=Eastin+Grand+Hotel+Sathorn+Bangkok&output=embed"
            loading="lazy">
        </iframe>

    </div>
</section>

<footer>
    With Love ♥<br>
    Gaw & Team
</footer>

<script>
const targetDate = new Date("2026-09-12T18:00:00").getTime();

function countdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.querySelector(".countdown").innerHTML =
            "<h2>Today is our wedding day ♥</h2>";
        return;
    }

    document.getElementById("days").innerHTML =
        Math.floor(distance / (1000 * 60 * 60 * 24));

    document.getElementById("hours").innerHTML =
        Math.floor((distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60));

    document.getElementById("minutes").innerHTML =
        Math.floor((distance % (1000 * 60 * 60))
        / (1000 * 60));

    document.getElementById("seconds").innerHTML =
        Math.floor((distance % (1000 * 60))
        / 1000);
}

countdown();
setInterval(countdown, 1000);
</script>

</body>
</html>
